<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280" />
<title>《廿四道·城外》Hub 云纹 Overlay Preview</title>
<style>
  @font-face {
    font-family: "NotoSerifSC";
    src: local("Noto Serif CJK SC"), local("Noto Serif CJK SC Regular"),
         url("file:///usr/share/fonts/opentype/noto/NotoSerifCJK-Regular.ttc") format("collection");
    font-weight: 400;
  }
  @font-face {
    font-family: "NotoSerifSC";
    src: local("Noto Serif CJK SC Bold"),
         url("file:///usr/share/fonts/opentype/noto/NotoSerifCJK-Bold.ttc") format("collection");
    font-weight: 700;
  }
  @font-face {
    font-family: "NotoSansSC";
    src: local("Noto Sans CJK SC"),
         url("file:///usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc") format("collection");
    font-weight: 400;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1280px; height: 720px; overflow: hidden;
    background: #1a1208;
  }
  #stage {
    position: relative;
    width: 1280px; height: 720px;
    overflow: hidden;
    background: #1a1208 center/cover no-repeat;
    background-image: url("./hub_bg_clean.png");
  }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  .ui { pointer-events: auto; }

  /* —— Title —— */
  .title-wrap {
    position: absolute; left: 36px; top: 22px;
    display: flex; align-items: center; gap: 10px;
  }
  .title-frame {
    position: relative;
    padding: 8px 22px 10px;
    background:
      linear-gradient(180deg, rgba(252,244,220,.92), rgba(232,214,170,.88) 55%, rgba(210,180,130,.90));
    border: 1.5px solid #c9a45a;
    box-shadow:
      0 0 0 1px rgba(90,50,10,.35) inset,
      0 2px 10px rgba(40,20,0,.35),
      0 0 18px rgba(212,168,80,.25);
    color: #2a1a08;
    font-family: "NotoSerifSC", "Noto Serif CJK SC", serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: 0.12em;
    line-height: 1.1;
  }
  .title-frame .seal {
    position: absolute; right: -18px; top: -6px;
    width: 28px; height: 28px;
    display: none;
  }
  .seal-box {
    width: 26px; height: 26px;
    background: radial-gradient(circle at 35% 30%, #d84a3a, #8c1e14 70%);
    border: 1px solid #5a1008;
    box-shadow: 0 1px 3px rgba(0,0,0,.4);
    color: #f5e6c8;
    font-size: 11px;
    font-family: "NotoSerifSC", serif;
    display: flex; align-items: center; justify-content: center;
    transform: rotate(6deg);
  }

  /* —— Currency chips —— */
  .currency-bar {
    position: absolute; right: 48px; top: 22px;
    display: flex; gap: 14px; align-items: center;
  }
  .chip {
    position: relative;
    display: flex; align-items: center; gap: 8px;
    min-width: 168px;
    height: 40px;
    padding: 0 36px 0 14px;
    color: #f5e6c0;
    font-family: "NotoSansSC", "Noto Sans CJK SC", sans-serif;
    font-size: 14px;
    letter-spacing: 0.06em;
  }
  .chip .chip-bg { position: absolute; inset: 0; z-index: 0; }
  .chip .chip-bg svg { width: 100%; height: 100%; display: block; }
  .chip .icon, .chip .label, .chip .value, .chip .plus { position: relative; z-index: 1; }
  .chip .label { color: #e8c878; font-family: "NotoSerifSC", serif; font-size: 13px; }
  .chip .value { font-variant-numeric: tabular-nums; font-weight: 600; color: #fff4d8; text-shadow: 0 1px 2px rgba(0,0,0,.55); }
  .chip .plus {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #f0d878, #b8862a 70%);
    border: 1px solid #6a4810;
    color: #3a2808; font-weight: 700; font-size: 16px; line-height: 20px;
    text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  .chip .icon {
    width: 22px; height: 22px; flex-shrink: 0;
  }
  .settings-orb {
    width: 34px; height: 34px; margin-left: 4px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, #ffe9a0, #d4a24a 45%, #8a5a18 100%);
    border: 1.5px solid #5a3a10;
    box-shadow: 0 0 10px rgba(212,168,80,.45), inset 0 0 6px rgba(255,240,180,.5);
    position: relative;
  }
  .settings-orb::after {
    content: "";
    position: absolute; inset: 7px;
    border-radius: 50%;
    border: 1.5px solid rgba(90,50,10,.55);
    box-shadow: inset 0 0 4px rgba(255,230,150,.4);
  }

  /* —— Left sidebar —— */
  .sidebar {
    position: absolute; left: 28px; top: 168px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .side-btn {
    position: relative;
    width: 168px; height: 48px;
    display: flex; align-items: center; gap: 10px;
    padding: 0 14px 0 12px;
    color: #3a2810;
    font-family: "NotoSerifSC", serif;
    font-size: 16px;
    letter-spacing: 0.14em;
    font-weight: 700;
  }
  .side-btn .sb-bg { position: absolute; inset: 0; z-index: 0; }
  .side-btn .sb-bg svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .side-btn .sb-icon, .side-btn .sb-label { position: relative; z-index: 1; }
  .side-btn .sb-icon { width: 26px; height: 26px; flex-shrink: 0; }
  .side-btn .tassel {
    position: absolute; right: -22px; top: 6px; z-index: 2;
    width: 18px; height: 56px;
  }

  /* —— Bottom dock —— */
  .dock {
    position: absolute; left: 50%; bottom: 18px;
    transform: translateX(-50%);
    width: 720px; height: 92px;
  }
  .dock .dock-frame {
    position: absolute; inset: 0; z-index: 0;
  }
  .dock .dock-frame svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .dock-items {
    position: relative; z-index: 1;
    height: 100%;
    display: flex; align-items: center; justify-content: space-around;
    padding: 0 56px 6px;
  }
  .dock-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    width: 96px;
    color: #d8c090;
    font-family: "NotoSerifSC", serif;
    font-size: 14px;
    letter-spacing: 0.18em;
  }
  .dock-item .di-icon {
    width: 46px; height: 46px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .dock-item.selected {
    color: #ffe9a8;
    text-shadow: 0 0 10px rgba(255,200,80,.55);
  }
  .dock-item.selected .di-icon::before {
    content: "";
    position: absolute; inset: -6px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,210,100,.55), rgba(255,180,40,.15) 55%, transparent 70%);
    box-shadow: 0 0 16px rgba(255,200,80,.55);
    z-index: 0;
  }
  .dock-item .di-icon svg { position: relative; z-index: 1; }
</style>
</head>
