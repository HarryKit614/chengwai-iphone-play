<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>《廿四道·城外》按钮 v5 · 云纹四向比选</title>
<link rel="stylesheet" href="./buttons.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1280px; height: 720px; overflow: hidden; background: #140d05; }
#stage {
  position: relative; width: 1280px; height: 720px; overflow: hidden; padding: 0 18px;
  font-family: var(--cw-serif); color: #f5e6c0;
  background:
    radial-gradient(ellipse 80% 70% at 50% 45%, rgba(40, 24, 8, .15), rgba(10, 6, 2, .75)),
    linear-gradient(180deg, rgba(20, 12, 4, .86), rgba(26, 16, 6, .8)),
    url("../v4/bg_v4_blur.jpg") center / cover no-repeat, #1a1208;
}
#stage::before { content: ""; position: absolute; inset: 0; background: var(--cw-noise); opacity: .9; pointer-events: none; }
header { position: relative; height: 46px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid rgba(201, 160, 69, .35); }
header h1 { font-size: 21px; letter-spacing: .18em; color: #f5e0a0; text-shadow: 0 0 12px rgba(232, 200, 120, .3); }
header .sub { font-size: 16px; color: #c8b088; letter-spacing: .06em; }
header .note { margin-left: auto; font-size: 16px; color: #a8c8c0; }
.cols { position: relative; display: grid; grid-template-columns: 136px repeat(4, 1fr); height: 30px; align-items: center; }
.cols span { text-align: center; font-size: 16px; letter-spacing: .3em; color: #e8c878; }
.cols span i { font-style: normal; color: #8a7a60; letter-spacing: 0; font-size: 16px; margin-left: 4px; }
.row { position: relative; display: grid; grid-template-columns: 136px repeat(4, 1fr); height: 160px; }
.row + .row::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 1px;
  background: linear-gradient(90deg, rgba(201, 160, 69, .55), rgba(201, 160, 69, .18) 60%, transparent); }
.lab { display: flex; flex-direction: column; justify-content: center; gap: 6px; padding-left: 2px; }
.lab .tag { display: flex; align-items: center; gap: 8px; }
.lab b { width: 28px; height: 28px; display: grid; place-items: center; font-size: 17px; color: #fff3d2; border-radius: 4px;
  background: linear-gradient(180deg, #d0503a, #8c1e14); box-shadow: 0 0 0 1px #e8c878, 0 2px 4px rgba(0,0,0,.5); font-family: Georgia, serif; }
.lab h3 { font-size: 20px; letter-spacing: .12em; color: #f5e0a0; }
.lab p { font-size: 16px; line-height: 1.45; color: #bfa982; }
.cell { display: grid; grid-template-rows: 1fr 1fr; align-content: center; padding: 18px 0 16px; row-gap: 10px; }
.cell + .cell { border-left: 1px dashed rgba(201, 160, 69, .12); }
.line { display: flex; align-items: center; justify-content: center; gap: 16px; }
</style>
</head>
<body>
<div id="stage">
  <header>
    <h1>《廿四道·城外》按钮 · 云纹四向比选</h1><span class="sub">v5 · 购买 / 一键卸下 / 页签 / 标签</span>
    <span class="note">可悬停、按压试手感 · 样式 buttons.css</span>
  </header>
  <div class="cols"><span></span><span>常态</span><span>按下</span><span>选中</span><span>不可点</span></div>
  <div id="rows"></div>
</div>
<script>
const dirs = [
  ["a", "A", "玉牌嵌金", "青玉黄玉<br>四角金扣"],
  ["b", "B", "朱漆印章", "白文朱文<br>按下印泥涟漪"],
  ["c", "C", "卷轴页签", "绢条轴头<br>选中流云"],
  ["d", "D", "镂空窗棂", "云雷镂空<br>选中透暖光"],
];
const states = ["", "is-pressed", "is-selected", "is-disabled"];
const btn = (d, kind, st, txt) =>
  `<button class="cw cw-${d} cw-${kind} ${st}"${st === "is-disabled" ? " disabled" : ""}><span class="cw-label">${txt}</span></button>`;
document.getElementById("rows").innerHTML = dirs.map(([d, L, name, desc]) => `
  <section class="row" id="row${L}">
    <div class="lab"><div class="tag"><b>${L}</b><h3>${name}</h3></div><p>${desc}</p></div>
    ${states.map(st => `<div class="cell">
      <div class="line">${btn(d, "primary", st, "购买")}${btn(d, "secondary", st, "一键卸下")}</div>
      <div class="line">${btn(d, "tab", st, "符箓")}${btn(d, "chip", st, "天市符")}</div>
    </div>`).join("")}
  </section>`).join("");
</script>
</body>
</html>
